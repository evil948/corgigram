# Deprecated: use the Release workflow instead (builds NSIS/AppImage + OTA latest.json).
# Kept for quick raw .exe artifact without installer.

name: Build Windows (legacy zip)

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build desktop
        run: cargo build --release -p corgigram-desktop
      - name: Package zip
        shell: pwsh
        run: |
          $out = "dist/corgigram-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item target/release/corgigram-desktop.exe "$out/corgigram-desktop.exe"
          Compress-Archive -Path "$out/*" -DestinationPath "corgigram-windows-x86_64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: corgigram-windows-x86_64
          path: corgigram-windows-x86_64.zip
