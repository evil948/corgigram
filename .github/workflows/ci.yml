name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and test
        run: |
          cargo test -p corgigram-crypto -p corgigram-core -p corgigram-storage
          cargo check -p corgigram-desktop
