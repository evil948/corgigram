name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify version sync
        run: |
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | awk '{print $3}' | tr -d '"')
          TAURI_VER=$(jq -r .version apps/desktop/tauri.conf.json)
          if [ "$CARGO_VER" != "$TAURI_VER" ]; then
            echo "::error::Cargo.toml ($CARGO_VER) != tauri.conf.json ($TAURI_VER)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI (npm)
        run: npm install -g @tauri-apps/cli@2

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: tauri-apps/tauri-action@v0
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: ../../scripts/build-appimage-ci.sh
          tagName: v__VERSION__
          releaseName: Corgigram v__VERSION__
          releaseBody: |
            Автообновление встроено в приложение.
            - Linux: AppImage
            - Windows: NSIS installer (.exe)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - uses: tauri-apps/tauri-action@v0
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Corgigram v__VERSION__
          releaseBody: |
            Автообновление встроено в приложение.
            - Linux: AppImage
            - Windows: NSIS installer (.exe)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
